  <!-- TEST: Fehleranzeige auf dem Bildschirm, nach der Fehlersuche wieder entfernen -->
  <script>
  (function(){
    var box = null;
    function show(t){
      try {
        if(!box){
          box = document.createElement('div');
          box.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:99999;background:#300;color:#fff;font:12px monospace;padding:8px;max-height:45%;overflow:auto;white-space:pre-wrap';
          (document.body || document.documentElement).appendChild(box);
        }
        box.textContent += t + '\n';
      } catch(x){}
    }
    window.addEventListener('error', function(e){
      show('FEHLER: ' + e.message + ' @ ' + e.filename + ':' + e.lineno);
    }, true);
    window.addEventListener('unhandledrejection', function(e){
      show('PROMISE: ' + e.reason);
    });
    var oe = console.error;
    console.error = function(){ show('CONSOLE: ' + Array.prototype.join.call(arguments,' ')); oe.apply(console, arguments); };
    var ow = console.warn;
    console.warn = function(){ show('WARN: ' + Array.prototype.join.call(arguments,' ')); ow.apply(console, arguments); };
    window.addEventListener('load', function(){
      show('INFO: maplibregl ' + (window.maplibregl ? maplibregl.getVersion ? maplibregl.getVersion() : 'geladen' : 'FEHLT'));
      try {
        var c = document.createElement('canvas');
        var gl = c.getContext('webgl2') || c.getContext('webgl');
        show('INFO: WebGL ' + (gl ? (c.getContext('webgl2') ? '2' : '1') : 'NICHT VERFUEGBAR'));
      } catch(x){ show('INFO: WebGL Fehler ' + x); }
    });
  })();
  </script>
