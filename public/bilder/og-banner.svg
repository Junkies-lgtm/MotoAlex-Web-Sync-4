<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <!-- Radial Accent Glow -->
    <radialGradient id="orangeGlow" cx="28%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF5722" stop-opacity="0.28" />
      <stop offset="60%" stop-color="#FF5722" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#FF5722" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="blueGlow" cx="80%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </radialGradient>

    <!-- Icon Shadow -->
    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6" />
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#FF5722" flood-opacity="0.3" />
    </filter>

    <!-- Pill Shadow -->
    <filter id="pillShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Ambient Glows -->
  <rect width="1200" height="630" fill="url(#orangeGlow)" />
  <rect width="1200" height="630" fill="url(#blueGlow)" />

  <!-- Subtle Winding Road / Curve vector decoration in background -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M-100,500 C200,550 350,420 500,470 C650,520 800,380 950,420 C1100,460 1250,350 1350,380" stroke-dasharray="16 12" />
    <path d="M-50,200 C150,120 300,280 550,180 C800,80 950,220 1250,140" stroke-dasharray="24 16" />
  </g>

  <!-- Decorative Outer Subtle Border -->
  <rect x="24" y="24" width="1152" height="582" rx="20" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- Left: App Icon Group (240x240 px) -->
  <g transform="translate(100, 195)" filter="url(#iconShadow)">
    <!-- App Icon Base Box -->
    <rect width="240" height="240" rx="52" fill="#0F172A" stroke="#334155" stroke-width="2.5" />
    
    <!-- Inner SVG scaled up (240 / 108 = 2.2222) -->
    <g transform="scale(2.2222)">
      <!-- Bike Paths -->
      <path fill="#000000" fill-opacity="0.4" d="M54,12 L64,32 L68,54 L62,84 L54,94 L46,84 L40,54 L44,32 Z" />
      <path fill="#090D16" d="M50,12 h8 a3,3 0 0,1 3,3 v16 a3,3 0 0,1 -3,3 h-8 a3,3 0 0,1 -3,-3 v-16 a3,3 0 0,1 3,-3 Z" />
      <path fill="#090D16" d="M49,76 h10 a4,4 0 0,1 4,4 v18 a4,4 0 0,1 -4,4 h-10 a4,4 0 0,1 -4,-4 v-18 a4,4 0 0,1 4,-4 Z" />
      <path fill="#475569" d="M30,30 L48,34 L48,37 L30,33 Z" />
      <path fill="#475569" d="M78,30 L60,34 L60,37 L78,33 Z" />
      <path fill="#FF5722" d="M26,29 h5 v6 h-5 Z" />
      <path fill="#FF7043" d="M77,29 h5 v6 h-5 Z" />
      <path fill="#334155" d="M54,20 L65,35 L68,52 L62,72 L57,84 L54,89 L51,84 L46,72 L40,52 L43,35 Z" />
      <path fill="#FF5722" d="M54,20 L63,34 L54,40 L45,34 Z" />
      <path fill="#FF7043" d="M65,36 L75,48 L68,54 L63,44 Z" />
      <path fill="#FF7043" d="M43,36 L33,48 L40,54 L45,44 Z" />
      <path fill="#1E293B" d="M54,39 L61,45 L59,60 L54,63 L49,60 L47,45 Z" />
      <path fill="#0F172A" d="M54,63 L58,65 L57,74 L54,77 L51,74 L50,65 Z" />
      <path fill="#FF5722" d="M54,77 L57,79 L55,87 L54,89 L53,87 L51,79 Z" />
      <path fill="#38BDF8" d="M52,23 L54,22 L53,26 Z" />
      <path fill="#38BDF8" d="M56,23 L54,22 L55,26 Z" />
      <path fill="#EF4444" d="M52,87 h4 v2 h-4 Z" />
    </g>
  </g>

  <!-- Right: Branding & Typography -->
  <g transform="translate(390, 180)">
    
    <!-- Top Category Pill -->
    <g transform="translate(0, 0)">
      <rect width="190" height="34" rx="17" fill="#1E293B" stroke="#FF5722" stroke-width="1.5" stroke-opacity="0.8" />
      <text x="95" y="22" fill="#FF5722" font-family="'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="1.5">MOTORRAD-APP</text>
    </g>

    <!-- Main Title: MotoAlex Navigation -->
    <g transform="translate(0, 82)">
      <text font-family="'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="68" font-weight="800" letter-spacing="-1">
        <tspan fill="#FFFFFF">Moto</tspan><tspan fill="#FF5722">Alex</tspan>
      </text>
      <!-- Navigation Badge -->
      <g transform="translate(325, -46)">
        <rect width="138" height="38" rx="8" fill="#FF5722" />
        <text x="69" y="25" fill="#FFFFFF" font-family="'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" text-anchor="middle" letter-spacing="1.2">NAVIGATION</text>
      </g>
    </g>

    <!-- Subtitle: Kurvige Motorrad-Routen & Navigation -->
    <g transform="translate(0, 138)">
      <text x="0" y="0" fill="#E2E8F0" font-family="'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="600" letter-spacing="-0.3">
        Kurvige Motorrad-Routen &amp; Navigation
      </text>
    </g>

    <!-- Feature Badges Row -->
    <g transform="translate(0, 185)">
      <!-- Badge 1: Kurvenrouting -->
      <g transform="translate(0, 0)" filter="url(#pillShadow)">
        <rect width="195" height="42" rx="21" fill="#1E293B" stroke="#334155" stroke-width="1.2" />
        <text x="97" y="26" fill="#F1F5F9" font-family="'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" text-anchor="middle">
          🗺️ Kurvenrouting
        </text>
      </g>

      <!-- Badge 2: 100% Offline -->
      <g transform="translate(210, 0)" filter="url(#pillShadow)">
        <rect width="180" height="42" rx="21" fill="#1E293B" stroke="#334155" stroke-width="1.2" />
        <text x="90" y="26" fill="#F1F5F9" font-family="'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" text-anchor="middle">
          📶 100% Offline
        </text>
      </g>

      <!-- Badge 3: Kostenlos & Ohne Abo -->
      <g transform="translate(405, 0)" filter="url(#pillShadow)">
        <rect width="215" height="42" rx="21" fill="#1E293B" stroke="#334155" stroke-width="1.2" />
        <text x="107" y="26" fill="#F1F5F9" font-family="'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" text-anchor="middle">
          ✨ Kostenlos ohne Abo
        </text>
      </g>
    </g>

  </g>

  <!-- Bottom URL / Domain Watermark -->
  <text x="1100" y="580" fill="#64748B" font-family="'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" text-anchor="end" letter-spacing="0.5">
    motoalex-navigation.de
  </text>
</svg>